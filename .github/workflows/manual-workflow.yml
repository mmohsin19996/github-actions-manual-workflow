name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: false
        default: dev
      version:
        description: "Version"
        required: true

jobs:
  run-manual-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Print inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
